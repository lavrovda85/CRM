# Lens / OpenLens: use kubeconfig from the server after k3s install.
#
# On server:
#   sudo cat /etc/rancher/k3s/k3s.yaml
#
# Copy to your PC as ~/.kube/config-crm-server and replace:
#   server: https://127.0.0.1:6443
# with:
#   server: https://192.168.9.17:6443
#
# Firewall on server must allow TCP 6443 from your workstation:
#   sudo ufw allow 6443/tcp
#
# In Lens: File -> Add Cluster -> paste kubeconfig content.

apiVersion: v1
kind: Config
clusters:
  - name: crm-k3s
    cluster:
      server: https://192.168.9.17:6443
      insecure-skip-tls-verify: true
contexts:
  - name: crm-k3s
    context:
      cluster: crm-k3s
      user: crm-k3s
current-context: crm-k3s
users:
  - name: crm-k3s
    user:
      client-certificate-data: REPLACE_WITH_BASE64_FROM_SERVER_FILE
      client-key-data: REPLACE_WITH_BASE64_FROM_SERVER_FILE

# Easier: copy full /etc/rancher/k3s/k3s.yaml and only change the `server:` URL line.
