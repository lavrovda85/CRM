# LAN / IP production overrides (no dev bind mounts, frontend production build).
# Uses Compose merge `!reset` so empty lists replace inherited volumes/ports (see Docker Compose merge docs).
# Usage from repo root:
#   docker compose -f docker-compose.yml -f deploy/server/docker-compose.ip.yml up -d --build
# Empty /opt/crm: on server run deploy/server/bootstrap-repo-path.sh, then .env, then first-time-stack.sh

services:
  # Sidecar: git pull, docker-compose build/up, apply_schema, health check, rollback on failure.
  # Mount host repo at DEPLOY_HOST_REPO_PATH (default /opt/crm) and set GITHUB_* + ADMIN_DEPLOY_ENABLED on backend.
  deploy-agent:
    build:
      # Must be "." when merged with repo-root docker-compose.yml (not "../.." — that resolves past the repo).
      context: .
      dockerfile: docker/deploy-agent/Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_REPO_PATH: /deploy/repo
      DEPLOY_COMPOSE_FILE_MAIN: docker-compose.yml
      DEPLOY_COMPOSE_FILE_EXTRA: deploy/server/docker-compose.ip.yml
      DEPLOY_HEALTH_URL: http://backend:8000/health
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      GITHUB_SSH_KEY: ${GITHUB_SSH_KEY:-}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:-}
      DEPLOY_SSH_HOST: ${DEPLOY_SSH_HOST:-}
      DEPLOY_SSH_PORT: ${DEPLOY_SSH_PORT:-}
      DEPLOY_SSH_USER: ${DEPLOY_SSH_USER:-}
      DEPLOY_SSH_KEY: ${DEPLOY_SSH_KEY:-}
      DEPLOY_SSH_REPO_PATH: ${DEPLOY_SSH_REPO_PATH:-}
      DEPLOY_REMOTE_COMPOSE_FILE_MAIN: ${DEPLOY_REMOTE_COMPOSE_FILE_MAIN:-}
      DEPLOY_REMOTE_COMPOSE_FILE_EXTRA: ${DEPLOY_REMOTE_COMPOSE_FILE_EXTRA:-}
      DEPLOY_REMOTE_HEALTH_URL: ${DEPLOY_REMOTE_HEALTH_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEPLOY_HOST_REPO_PATH:-/opt/crm}:/deploy/repo:rw
    expose:
      - "9090"

  xray-openai:
    restart: unless-stopped

  xray-gateway:
    profiles: !reset null
    init: true
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  minio:
    restart: unless-stopped
    ports: !reset []

  minio-init:
    restart: "no"

  keycloak:
    restart: unless-stopped
    ports: !reset []

  backend:
    restart: unless-stopped
    volumes: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: !reset []

  keycloak-sync:
    restart: "no"
    volumes: !reset []

  mcp-server:
    restart: unless-stopped
    volumes: !reset []
    ports: !reset []

  celery-worker:
    restart: unless-stopped
    volumes: !reset []

  celery-beat:
    restart: unless-stopped
    volumes: !reset []

  # Variant A: same-origin API — set FRONTEND_HOST_PORT=9000 in .env (see env.template.ip).
  # Requires NEXT_PUBLIC_API_URL empty. MinIO has no host port here, so 9000 is free for Next.js.
  frontend:
    build:
      target: production
    restart: unless-stopped
    volumes: !reset []

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
