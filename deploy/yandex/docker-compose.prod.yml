# Production Docker Compose override.
# Usage: docker compose -f docker-compose.yml -f deploy/yandex/docker-compose.prod.yml up -d --build
#
# Changes vs dev:
#   - No source-code bind mounts (built images used)
#   - frontend uses production build target
#   - keycloak uses start (not start-dev) + forced HTTPS proxy headers
#   - All services get restart: unless-stopped
#   - Ports closed except nginx 80/443
#   - nginx container also handles certbot webroot + SSL

services:
  xray-openai:
    restart: unless-stopped

  postgres:
    restart: unless-stopped
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  minio:
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-init:
    restart: "no"

  keycloak:
    command: start --import-realm
    restart: unless-stopped
    ports: []
    environment:
      KC_HOSTNAME: ${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KC_HOSTNAME_PATH: /keycloak
      KC_HTTP_RELATIVE_PATH: /keycloak

  backend:
    restart: unless-stopped
    volumes: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: []
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}

  mcp-server:
    restart: unless-stopped
    volumes: []
    ports: []
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}

  celery-worker:
    restart: unless-stopped
    volumes: []
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}

  celery-beat:
    restart: unless-stopped
    volumes: []

  frontend:
    build:
      target: production
    restart: unless-stopped
    volumes: []
    ports: []

  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/yandex/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
