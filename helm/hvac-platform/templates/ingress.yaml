{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hvac-platform.fullname" . }}
  labels:
    {{- include "hvac-platform.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "hvac-platform.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "hvac-platform.fullname" . }}-mcp
                port:
                  number: {{ .Values.mcpServer.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "hvac-platform.fullname" . }}-keycloak
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hvac-platform.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
