apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hvac-platform.fullname" . }}-secrets
  labels:
    {{- include "hvac-platform.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | b64enc | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloakClientSecret | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | b64enc | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
