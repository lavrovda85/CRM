apiVersion: v1
kind: Service
metadata:
  name: {{ include "hvac-platform.fullname" . }}-mcp
  labels:
    {{- include "hvac-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcpServer.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hvac-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
