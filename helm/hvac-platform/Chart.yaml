apiVersion: v2
name: hvac-platform
description: SPEC CRM Platform Helm Chart
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
  - name: keycloak
    version: "21.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: keycloak.enabled
