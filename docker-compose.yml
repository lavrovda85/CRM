services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6600:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    # `mc ready local` requires a preconfigured alias; official image includes curl.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # HTTP proxy on 10808: OpenAI hostnames -> VLESS (if OPENAI_VLESS_URI set), else direct.
  # Optional TCP relay on XRAY_GATEWAY_LISTEN_PORT when XRAY_GATEWAY_ENABLED=true (see .env.example).
  # Backend/Celery set OPENAI_HTTP_PROXY=http://xray-openai:10808 only when using this path.
  xray-openai:
    build:
      context: .
      dockerfile: docker/xray/Dockerfile
    environment:
      OPENAI_VLESS_URI: ${OPENAI_VLESS_URI:-}
    expose:
      - "10808"
    restart: unless-stopped

  # Public VLESS TCP relay (host network — no Docker NAT). Start with deploy/server/docker-compose.ip.yml.
  xray-gateway:
    build:
      context: .
      dockerfile: docker/xray/Dockerfile
    network_mode: host
    environment:
      XRAY_GATEWAY_ONLY: "true"
      XRAY_GATEWAY_VLESS_URI: ${XRAY_GATEWAY_VLESS_URI:-}
      XRAY_GATEWAY_LISTEN_PORT: ${XRAY_GATEWAY_LISTEN_PORT:-443}
      XRAY_GATEWAY_RELAY: ${XRAY_GATEWAY_RELAY:-socat}
      XRAY_GATEWAY_DOWNSTREAM_ADDRESS: ${XRAY_GATEWAY_DOWNSTREAM_ADDRESS:-}
      XRAY_GATEWAY_REALITY_PRIVATE_KEY: ${XRAY_GATEWAY_REALITY_PRIVATE_KEY:-}
    restart: unless-stopped
    profiles:
      - gateway

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb local/${MINIO_BUCKET} --ignore-existing;
        mc anonymous set download local/${MINIO_BUCKET}/public;
        exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/hvac-realm.json:/opt/keycloak/data/import/hvac-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  backend:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_TOKEN_ISSUER: ${KEYCLOAK_TOKEN_ISSUER:-}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      BACKEND_DEBUG: ${BACKEND_DEBUG}
      # Idempotent create_all + DDL; keep true unless you run dedicated migrations only.
      SCHEMA_BOOTSTRAP_ON_STARTUP: ${SCHEMA_BOOTSTRAP_ON_STARTUP:-true}
      SECRET_KEY: ${SECRET_KEY}
      # Pass through from repo .env so DB-only login works in Docker (Keycloak bypass password).
      DEV_BYPASS_AUTH: ${DEV_BYPASS_AUTH:-false}
      DEV_BYPASS_PASSWORD: ${DEV_BYPASS_PASSWORD:-}
      KEYCLOAK_SKIP_USER_SYNC: ${KEYCLOAK_SKIP_USER_SYNC:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_HTTP_PROXY: ${OPENAI_HTTP_PROXY:-}
      DEPLOY_AGENT_URL: ${DEPLOY_AGENT_URL:-}
      ADMIN_DEPLOY_ENABLED: ${ADMIN_DEPLOY_ENABLED:-false}
      AI_ASSISTANT_MAX_TOOL_ROUNDS: ${AI_ASSISTANT_MAX_TOOL_ROUNDS:-24}
      TASK_SCHEDULER_ENABLED: ${TASK_SCHEDULER_ENABLED:-false}
      TASK_SCHEDULER_CRON_MINUTE: ${TASK_SCHEDULER_CRON_MINUTE:-0}
      TASK_SCHEDULER_CRON_HOUR: ${TASK_SCHEDULER_CRON_HOUR:-9}
      TASK_SCHEDULER_CRON_DAY_OF_MONTH: ${TASK_SCHEDULER_CRON_DAY_OF_MONTH:-*}
      TASK_SCHEDULER_CRON_MONTH_OF_YEAR: ${TASK_SCHEDULER_CRON_MONTH_OF_YEAR:-*}
      TASK_SCHEDULER_CRON_DAY_OF_WEEK: ${TASK_SCHEDULER_CRON_DAY_OF_WEEK:-1-5}
      TASK_SCHEDULER_TITLE: ${TASK_SCHEDULER_TITLE:-Scheduled task}
      TASK_SCHEDULER_DESCRIPTION: ${TASK_SCHEDULER_DESCRIPTION:-}
      TASK_SCHEDULER_PRIORITY: ${TASK_SCHEDULER_PRIORITY:-medium}
      TASK_SCHEDULER_TEMPLATE_ID: ${TASK_SCHEDULER_TEMPLATE_ID:-}
      TASK_SCHEDULER_ASSIGNED_TO: ${TASK_SCHEDULER_ASSIGNED_TO:-}
      TASK_SCHEDULER_REQUESTED_BY: ${TASK_SCHEDULER_REQUESTED_BY:-}
      TASK_SCHEDULER_BOARD_ID: ${TASK_SCHEDULER_BOARD_ID:-}
      TASK_SCHEDULER_CLIENT_ID: ${TASK_SCHEDULER_CLIENT_ID:-}
      TASK_SCHEDULER_DUE_IN_HOURS: ${TASK_SCHEDULER_DUE_IN_HOURS:-24}
      TASK_SCHEDULER_OBSERVER_IDS: ${TASK_SCHEDULER_OBSERVER_IDS:-}
      TASK_SCHEDULER_CO_ASSIGNEE_IDS: ${TASK_SCHEDULER_CO_ASSIGNEE_IDS:-}
      TASK_SCHEDULER_DEDUP_WINDOW_MINUTES: ${TASK_SCHEDULER_DEDUP_WINDOW_MINUTES:-180}
    # Public DNS — avoids "Temporary failure in name resolution" when fetching
    # external URLs (tender import, OpenAI, etc.) inside the container.
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}
    ports:
      - "8000:8000"
    # Prefer Python over curl: some images / worker restarts make curl-based checks flaky.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read()",
        ]
      interval: 10s
      timeout: 12s
      retries: 8
      start_period: 120s
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      xray-openai:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # One-shot after API is up: links users.keycloak_id; if KEYCLOAK_SYNC_INITIAL_PASSWORD is set, creates missing KC users and resets every active user password to that value (unset after bootstrap).
  keycloak-sync:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      BACKEND_DEBUG: ${BACKEND_DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: ${REDIS_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SKIP_USER_SYNC: ${KEYCLOAK_SKIP_USER_SYNC:-false}
      KEYCLOAK_SYNC_INITIAL_PASSWORD: ${KEYCLOAK_SYNC_INITIAL_PASSWORD:-}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: ["python", "-m", "app.cli.keycloak_sync"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: "no"

  mcp-server:
    build:
      context: ./backend
      target: mcp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      MCP_HOST: ${MCP_HOST}
      MCP_PORT: ${MCP_PORT}
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      # Tender document analysis (tender_analysis job) runs in this process — same as backend API.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_HTTP_PROXY: ${OPENAI_HTTP_PROXY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TASK_SCHEDULER_ENABLED: ${TASK_SCHEDULER_ENABLED:-false}
      TASK_SCHEDULER_CRON_MINUTE: ${TASK_SCHEDULER_CRON_MINUTE:-0}
      TASK_SCHEDULER_CRON_HOUR: ${TASK_SCHEDULER_CRON_HOUR:-9}
      TASK_SCHEDULER_CRON_DAY_OF_MONTH: ${TASK_SCHEDULER_CRON_DAY_OF_MONTH:-*}
      TASK_SCHEDULER_CRON_MONTH_OF_YEAR: ${TASK_SCHEDULER_CRON_MONTH_OF_YEAR:-*}
      TASK_SCHEDULER_CRON_DAY_OF_WEEK: ${TASK_SCHEDULER_CRON_DAY_OF_WEEK:-1-5}
      TASK_SCHEDULER_TITLE: ${TASK_SCHEDULER_TITLE:-Scheduled task}
      TASK_SCHEDULER_DESCRIPTION: ${TASK_SCHEDULER_DESCRIPTION:-}
      TASK_SCHEDULER_PRIORITY: ${TASK_SCHEDULER_PRIORITY:-medium}
      TASK_SCHEDULER_TEMPLATE_ID: ${TASK_SCHEDULER_TEMPLATE_ID:-}
      TASK_SCHEDULER_ASSIGNED_TO: ${TASK_SCHEDULER_ASSIGNED_TO:-}
      TASK_SCHEDULER_REQUESTED_BY: ${TASK_SCHEDULER_REQUESTED_BY:-}
      TASK_SCHEDULER_BOARD_ID: ${TASK_SCHEDULER_BOARD_ID:-}
      TASK_SCHEDULER_CLIENT_ID: ${TASK_SCHEDULER_CLIENT_ID:-}
      TASK_SCHEDULER_DUE_IN_HOURS: ${TASK_SCHEDULER_DUE_IN_HOURS:-24}
      TASK_SCHEDULER_OBSERVER_IDS: ${TASK_SCHEDULER_OBSERVER_IDS:-}
      TASK_SCHEDULER_CO_ASSIGNEE_IDS: ${TASK_SCHEDULER_CO_ASSIGNEE_IDS:-}
      TASK_SCHEDULER_DEDUP_WINDOW_MINUTES: ${TASK_SCHEDULER_DEDUP_WINDOW_MINUTES:-180}
    dns:
      - ${DOCKER_DNS_PRIMARY:-8.8.8.8}
      - ${DOCKER_DNS_SECONDARY:-1.1.1.1}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      xray-openai:
        condition: service_started

  celery-beat:
    build:
      context: ./backend
      target: beat
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TASK_SCHEDULER_ENABLED: ${TASK_SCHEDULER_ENABLED:-false}
      TASK_SCHEDULER_CRON_MINUTE: ${TASK_SCHEDULER_CRON_MINUTE:-0}
      TASK_SCHEDULER_CRON_HOUR: ${TASK_SCHEDULER_CRON_HOUR:-9}
      TASK_SCHEDULER_CRON_DAY_OF_MONTH: ${TASK_SCHEDULER_CRON_DAY_OF_MONTH:-*}
      TASK_SCHEDULER_CRON_MONTH_OF_YEAR: ${TASK_SCHEDULER_CRON_MONTH_OF_YEAR:-*}
      TASK_SCHEDULER_CRON_DAY_OF_WEEK: ${TASK_SCHEDULER_CRON_DAY_OF_WEEK:-1-5}
      TASK_SCHEDULER_TITLE: ${TASK_SCHEDULER_TITLE:-Scheduled task}
      TASK_SCHEDULER_DESCRIPTION: ${TASK_SCHEDULER_DESCRIPTION:-}
      TASK_SCHEDULER_PRIORITY: ${TASK_SCHEDULER_PRIORITY:-medium}
      TASK_SCHEDULER_TEMPLATE_ID: ${TASK_SCHEDULER_TEMPLATE_ID:-}
      TASK_SCHEDULER_ASSIGNED_TO: ${TASK_SCHEDULER_ASSIGNED_TO:-}
      TASK_SCHEDULER_REQUESTED_BY: ${TASK_SCHEDULER_REQUESTED_BY:-}
      TASK_SCHEDULER_BOARD_ID: ${TASK_SCHEDULER_BOARD_ID:-}
      TASK_SCHEDULER_CLIENT_ID: ${TASK_SCHEDULER_CLIENT_ID:-}
      TASK_SCHEDULER_DUE_IN_HOURS: ${TASK_SCHEDULER_DUE_IN_HOURS:-24}
      TASK_SCHEDULER_OBSERVER_IDS: ${TASK_SCHEDULER_OBSERVER_IDS:-}
      TASK_SCHEDULER_CO_ASSIGNEE_IDS: ${TASK_SCHEDULER_CO_ASSIGNEE_IDS:-}
      TASK_SCHEDULER_DEDUP_WINDOW_MINUTES: ${TASK_SCHEDULER_DEDUP_WINDOW_MINUTES:-180}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL}
      NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM}
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID}
      NEXT_PUBLIC_AVATAR_SERVICE_BASE_URL: ${NEXT_PUBLIC_AVATAR_SERVICE_BASE_URL}
      NEXT_PUBLIC_TASK_TIMELINE_HOUR_START: ${NEXT_PUBLIC_TASK_TIMELINE_HOUR_START:-8}
      NEXT_PUBLIC_TASK_TIMELINE_HOUR_END: ${NEXT_PUBLIC_TASK_TIMELINE_HOUR_END:-20}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "${FRONTEND_HOST_PORT:-3500}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  miniodata:
