# Backend: unit tests + PostgreSQL integration (per TEST_REPORT recommendations).
name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hvac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hvac_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/hvac_test
      DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/hvac_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Unit tests (no live DB assumptions beyond import)
        run: python -m pytest tests/ -v -m "not integration" --tb=short

      - name: Integration tests (MCP task lifecycle, DB smoke)
        run: python -m pytest tests/ -v -m integration --tb=short
