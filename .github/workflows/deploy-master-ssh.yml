# GitHub repo → Settings → Secrets and variables → Actions:
#   DEPLOY_HOST    — server IP or hostname (e.g. 192.168.9.17)
#   DEPLOY_USER    — SSH user (e.g. ubuntu)
#   DEPLOY_SSH_KEY — private key PEM (full file contents, passwordless)
#   DEPLOY_PATH    — repo root on server (e.g. /opt/crm)
#
# On the server: add the matching public key to ~/.ssh/authorized_keys for DEPLOY_USER.
# If DEPLOY_PATH is empty: clone once on the server — see deploy/server/bootstrap-repo-path.sh
# Do NOT commit real keys or passwords.

name: Deploy master to server

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git checkout master
            git pull --ff-only origin master
            docker compose -f docker-compose.yml -f deploy/server/docker-compose.ip.yml build --parallel
            docker compose -f docker-compose.yml -f deploy/server/docker-compose.ip.yml up -d --remove-orphans
